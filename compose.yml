services:
  backend:
    profiles:
      - app
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sonik-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_USERNAME: sonik_user
      DB_PASSWORD: sonikpass
      DB_DATABASE: sonik_db
      DB_SYNCHRONIZE: "true"
      CORS_ORIGIN: http://localhost:3000,http://localhost:19006
    ports:
      - "4001:4000"
    depends_on:
      mysql-db:
        condition: service_healthy

  mysql-db:
    image: mysql:8.0
    container_name: sonik-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: sonik_db
      MYSQL_USER: sonik_user
      MYSQL_PASSWORD: sonikpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword123"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sonik-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql-db
      PMA_USER: root
      PMA_PASSWORD: rootpassword123
    depends_on:
      - mysql-db

volumes:
  mysql_data:
